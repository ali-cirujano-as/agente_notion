name: Reindex Notion

on:
  schedule:
    # Cada día a las 6:00 y 15:00 UTC
    - cron: '0 6 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests python-dotenv

      - name: Ejecutar reindexación
        env:
          NOTION_TOKEN_AWS: ${{ secrets.NOTION_TOKEN_AWS }}
          NOTION_TOKEN_GCP: ${{ secrets.NOTION_TOKEN_GCP }}
        run: python cron_reindex.py

      - name: Commit índices actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .data/*.json
          git diff --staged --quiet || git commit -m "chore: reindex Notion $(date -u +%Y-%m-%d)"
          git push
